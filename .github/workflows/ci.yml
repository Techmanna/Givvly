name: Givvly Web CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: https://api.staging.givvly.ng/v1
      API_INTERNAL_URL: https://api.staging.givvly.ng/v1
      NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: pk_test_givvly_ci_key
      NEXT_PUBLIC_USE_MOCK_API: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Run unit & component tests
        run: pnpm test

      - name: Build production bundle
        run: pnpm build

